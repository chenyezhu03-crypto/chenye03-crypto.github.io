      --accent: #0f7a5f;
      --accent-soft: rgba(15, 122, 95, 0.12);

      --surface: rgba(255, 255, 255, 0.78);
      --shadow: 0 18px 40px rgba(22, 48, 40, 0.08);
      --radius: 18px;
      --font-display: "ZCOOL XiaoWei", "Noto Sans SC", serif;
      --font-body: "Noto Sans SC", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #cfe8df 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #f3efe3 0%, transparent 50%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }
    .wrap { width: min(1080px, calc(100% - 2rem)); margin: 0 auto; padding: 1.5rem 0 4rem; }
    .brand {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1.15;
      margin: 0 0 0.45rem;
    }
    .lead { margin: 0; max-width: 40rem; color: var(--muted); line-height: 1.7; }
    .panel {
      margin-top: 1.2rem;
      padding: 1.2rem 1.25rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      animation: rise .7s ease both;
    }
    .panel h2 {
      margin: 0 0 .85rem;
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 400;
    }
    .countdown-box {
      display: grid;
      gap: .9rem;
      grid-template-columns: 1.2fr 1fr;
    }
    @media (max-width: 760px) { .countdown-box { grid-template-columns: 1fr; } }
    .next-release {
      padding: 1rem;
      border-radius: 14px;
      background: linear-gradient(135deg, rgba(15,122,95,.12), rgba(255,255,255,.4));
      border: 1px solid var(--line);
    }
    .next-release .label { color: var(--muted); font-size: .92rem; }
    .next-release .title { font-size: 1.25rem; font-weight: 700; margin: .25rem 0; }
    .clock {
      font-variant-numeric: tabular-nums;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .04em;
    }
    .schedule-list { display: grid; gap: .55rem; }
    .schedule-item {
      display: flex;
      justify-content: space-between;
      gap: .8rem;
      padding: .7rem 0;
      border-bottom: 1px solid var(--line);
      font-size: .95rem;
    }
    .schedule-item:last-child { border-bottom: 0; }
    .schedule-item span { color: var(--muted); }
    .remind-row {
      display: flex;
      flex-wrap: wrap;
      gap: .7rem;
      align-items: center;
      margin-top: 1rem;
    }
    .switch {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      cursor: pointer;
      user-select: none;
    }
    .switch input { width: 1.1rem; height: 1.1rem; }
    .toast {
      position: fixed;
      left: 50%;
      bottom: 1.4rem;
      transform: translateX(-50%) translateY(120%);
      background: var(--ink);
      color: #fff;
      padding: .75rem 1rem;
      border-radius: 999px;
      font-size: .92rem;
      opacity: 0;
      transition: .25s ease;
      z-index: 20;
      max-width: min(92vw, 28rem);
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .booking-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .75rem;
    }
    @media (max-width: 720px) { .booking-grid { grid-template-columns: 1fr; } }
    .book-card {
      display: grid;
      gap: .55rem;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.55);
    }
    .book-card.primary {
      border-color: rgba(15,122,95,.35);
      background: linear-gradient(160deg, rgba(15,122,95,.14), rgba(255,255,255,.65));
    }
    .book-card h3 { margin: 0; font-size: 1.08rem; }
    .book-card p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }
    .btn {
      appearance: none;
      border: 0;
      text-decoration: none;
      color: #fff;
      background: var(--accent);
      padding: .78rem 1rem;
      border-radius: 12px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      transition: transform .18s ease, background .18s ease;
    }
    .btn:hover { transform: translateY(-1px); background: #0c6650; }
    .btn.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn.ghost {
      background: rgba(15,122,95,.1);
      color: var(--accent);
    }
    .sticky-cta {
      position: sticky;
      top: 0;
      z-index: 10;
      margin: 0 calc(50% - 50vw);
      padding: .7rem 1rem;
      background: rgba(238,244,242,.9);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .sticky-inner {
      width: min(1080px, calc(100% - 0rem));
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: .55rem;
      align-items: center;
      justify-content: space-between;
    }
    .sticky-actions { display: flex; flex-wrap: wrap; gap: .5rem; }
    .sticky-actions .btn { padding: .65rem .9rem; }
    .meta { margin-top: .9rem; display: flex; flex-wrap: wrap; gap: .55rem; }
    .chip {
      display: inline-flex; align-items: center;
      padding: .32rem .68rem; border: 1px solid var(--line);
      background: var(--surface); border-radius: 999px; color: var(--muted); font-size: .88rem;
    }
    .toolbar {
      display: grid;
      grid-template-columns: 1.4fr 1fr auto;
      gap: .7rem;
      margin: 1rem 0 .8rem;
    }
    @media (max-width: 720px) { .toolbar { grid-template-columns: 1fr; } }
    input, select {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,.9);
      border-radius: 12px;
      padding: .8rem .9rem;
      font: inherit;
      color: var(--ink);
      outline: none;
    }
    input:focus, select:focus {
      border-color: rgba(15,122,95,.45);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .count { align-self: center; color: var(--muted); font-size: .92rem; white-space: nowrap; }
    .list { display: grid; gap: .55rem; }
    .doc {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .5rem 1rem;
      align-items: center;
      padding: .9rem .2rem;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: inherit;
      transition: background .15s ease, padding-left .15s ease;
    }
    .doc:hover { background: var(--accent-soft); padding-left: .55rem; border-radius: 10px; }
    .doc .name { font-weight: 700; font-size: 1.05rem; }
    .doc .sub { color: var(--muted); font-size: .9rem; margin-top: .15rem; }
    .fee { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
    .tips { margin: 0; padding-left: 1.1rem; color: var(--muted); line-height: 1.7; }
    .notice {
      margin-top: 1rem; padding: .9rem 1rem; border-left: 3px solid var(--warn);

    .channel strong { color: var(--accent); }
    .channel span { color: var(--muted); line-height: 1.6; font-size: .95rem; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

</head>

  <script>
    const STORAGE_KEY = "shsfkyy_remind_enabled_v1";
    const FIRED_KEY = "shsfkyy_remind_fired_v1";

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.remove("show"), 2200);
    }

    async function loadData() {
      const el = document.getElementById("appointment-data");
      if (el && el.textContent.trim()) return JSON.parse(el.textContent);
      const res = await fetch("./data/appointment.json", { cache: "no-store" });
      if (!res.ok) throw new Error("failed to load data");
      return res.json();
    }

    function shanghaiNow() {
      return new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Shanghai" }));
    }

    function nextOccurrence(hhmm, from = shanghaiNow()) {
      const [h, m] = hhmm.split(":").map(Number);
      const target = new Date(from);
      target.setHours(h, m, 0, 0);
      if (target <= from) target.setDate(target.getDate() + 1);
      return target;
    }

    function pad(n) { return String(n).padStart(2, "0"); }

    function formatRemain(ms) {
      if (ms < 0) ms = 0;
      const total = Math.floor(ms / 1000);
      const h = Math.floor(total / 3600);
      const m = Math.floor((total % 3600) / 60);
      const s = total % 60;
      return `${pad(h)}:${pad(m)}:${pad(s)}`;
    }

    function money(fee) {
      if (fee == null || fee === "") return "";
      return `参考 ¥${fee}`;
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (_) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        ta.remove();
        return ok;
      }
    }

    function buildIcs(schedules) {
      const lines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//shsfkyy-reminder//CN",
        "CALSCALE:GREGORIAN",
      ];
      schedules.forEach((s, idx) => {
        const [hh, mm] = s.time.split(":");
        lines.push(
          "BEGIN:VEVENT",
          `UID:shsfkyy-release-${s.id || idx}@local`,
          `SUMMARY:肺科医院放号提醒 · ${s.label}`,
          `DESCRIPTION:请前往官方渠道预约：微信/支付宝/医联。本日历仅提醒，不自动挂号。`,
          `RRULE:FREQ=DAILY`,
          `DTSTART;TZID=Asia/Shanghai:20260101T${hh}${mm}00`,
          `DURATION:PT10M`,
          "BEGIN:VALARM",
          "TRIGGER:-PT15M",
          "ACTION:DISPLAY",
          `DESCRIPTION:还有15分钟：${s.label}放号`,
          "END:VALARM",
          "END:VEVENT"
        );
      });
      lines.push("END:VCALENDAR");
      return lines.join("\r\n");
    }

    function downloadIcs(schedules) {
      const blob = new Blob([buildIcs(schedules)], { type: "text/calendar;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "肺科医院放号提醒.ics";
      a.click();
      URL.revokeObjectURL(url);
      toast("已生成日历文件，导入后每天提醒");
    }

    function markFired(key) {
      const map = JSON.parse(localStorage.getItem(FIRED_KEY) || "{}");
      map[key] = true;
      localStorage.setItem(FIRED_KEY, JSON.stringify(map));
    }
    function wasFired(key) {
      const map = JSON.parse(localStorage.getItem(FIRED_KEY) || "{}");
      return !!map[key];
    }

    async function ensureNotifyPermission() {
      if (!("Notification" in window)) {
        toast("当前浏览器不支持通知");
        return false;
      }
      if (Notification.permission === "granted") return true;
      if (Notification.permission === "denied") {
        toast("通知权限被禁用，请在浏览器设置中开启");
        return false;
      }
      const result = await Notification.requestPermission();
      return result === "granted";
    }

    function notify(title, body) {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      try {
        new Notification(title, { body, tag: title });
      } catch (_) {}
      toast(`${title}：${body}`);
    }

    function setupReminders(schedules) {
      const toggle = document.getElementById("remind-toggle");
      toggle.checked = localStorage.getItem(STORAGE_KEY) === "1";

      toggle.addEventListener("change", async () => {
        if (toggle.checked) {
          const ok = await ensureNotifyPermission();
          if (!ok) {
            toggle.checked = false;
            localStorage.setItem(STORAGE_KEY, "0");
            return;
          }
          localStorage.setItem(STORAGE_KEY, "1");
          toast("已开启放号提醒");
        } else {
          localStorage.setItem(STORAGE_KEY, "0");
          toast("已关闭放号提醒");
        }
      });

      setInterval(() => {
        if (localStorage.getItem(STORAGE_KEY) !== "1") return;
        const now = shanghaiNow();
        schedules.forEach((s) => {
          const next = nextOccurrence(s.time, now);
          const mins = Math.round((next - now) / 60000);
          const dayKey = `${next.getFullYear()}-${pad(next.getMonth() + 1)}-${pad(next.getDate())}`;
          (s.remind_minutes_before || [15, 0]).forEach((before) => {
            if (mins === before) {
              const fireKey = `${s.id}-${dayKey}-${before}`;
              if (wasFired(fireKey)) return;
              markFired(fireKey);
              if (before === 0) {
                notify("放号开始", `${s.label} 现在放号，点击页面一键去预约`);
              } else {
                notify("放号倒计时", `${s.label} 还有 ${before} 分钟放号`);
              }
            }
          });
        });
      }, 15000);
    }

    function renderBooking(entries) {
      const grid = document.getElementById("booking-grid");
      grid.innerHTML = entries.map((e) => `
        <div class="book-card ${e.primary ? "primary" : ""}">
          <h3>${e.title}</h3>
          <p>${e.subtitle || ""}</p>
          <button class="btn ${e.primary ? "" : "secondary"}" type="button" data-book="${e.id}">${e.button}</button>
        </div>
      `).join("");

      grid.querySelectorAll("[data-book]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const entry = entries.find((x) => x.id === btn.getAttribute("data-book"));
          if (!entry) return;
          if (entry.action === "open" && entry.url) {
            if (entry.url.startsWith("tel:")) {
              window.location.href = entry.url;
            } else {
              window.open(entry.url, "_blank", "noopener,noreferrer");
            }
            toast(`正在打开：${entry.title}`);
            return;
          }
          if (entry.action === "copy" && entry.copy_text) {
            const ok = await copyText(entry.copy_text);
            toast(ok ? (entry.hint || "已复制") : "复制失败，请手动搜索");
          }
        });
      });
    }

    function renderDoctors(data) {
      const deptSelect = document.getElementById("dept");
      const depts = [...new Set(data.doctors.map((d) => d.department).filter(Boolean))].sort();
      depts.forEach((name) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        deptSelect.appendChild(opt);
      });

      const qInput = document.getElementById("q");
      const list = document.getElementById("doctors");
      const count = document.getElementById("count");

      function paint() {
        const q = qInput.value.trim().toLowerCase();
        const dept = deptSelect.value;
        const rows = data.doctors.filter((d) => {
          const hitDept = !dept || d.department === dept;
          const blob = `${d.name || ""} ${d.department || ""} ${d.title || ""}`.toLowerCase();
          return hitDept && (!q || blob.includes(q));
        });
        count.textContent = `显示 ${rows.length} 位`;
        list.innerHTML = rows.map((d) => `
          <a class="doc" href="${d.url || "#"}" target="_blank" rel="noopener noreferrer">
            <div>
              <div class="name">${d.name}</div>
              <div class="sub">${[d.title, d.department].filter(Boolean).join(" · ")}</div>
            </div>
            <div class="fee">${money(d.fee)}</div>
          </a>
        `).join("") || `<div class="sub">没有匹配的医生</div>`;
      }
      qInput.addEventListener("input", paint);
      deptSelect.addEventListener("change", paint);
      paint();
    }

    function render(data) {
      document.getElementById("brand").textContent = data.hospital || "上海市肺科医院";
      const crawled = data.crawled_at ? new Date(data.crawled_at).toLocaleString("zh-CN") : "未知";
      document.getElementById("meta").innerHTML = [
        `<span class="chip">科室 ${data.departments.length}</span>`,
        `<span class="chip">医生 ${data.doctors.length}</span>`,
        ...(data.release_times || []).map((t) => `<span class="chip">${t}</span>`),
        `<span class="chip">更新 ${crawled}</span>`,
      ].join("");

      const schedules = data.release_schedules || [
        { id: "wechat_alipay", label: "微信 / 支付宝", time: "07:00", remind_minutes_before: [15, 0] },
        { id: "shdc", label: "医联平台", time: "07:30", remind_minutes_before: [15, 0] },
      ];

      document.getElementById("schedules").innerHTML = schedules.map((s) => `
        <div class="schedule-item">
          <strong>${s.label}</strong>
          <span>每天 ${s.time}</span>
        </div>
      `).join("");

      function tick() {
        const now = shanghaiNow();
        let nearest = null;
        schedules.forEach((s) => {
          const at = nextOccurrence(s.time, now);
          if (!nearest || at < nearest.at) nearest = { ...s, at };
        });
        if (!nearest) return;
        document.getElementById("next-title").textContent = `${nearest.label} · ${nearest.time}`;
        document.getElementById("countdown").textContent = formatRemain(nearest.at - now);
        document.getElementById("next-when").textContent =
          `上海时间 ${nearest.at.getMonth() + 1}/${nearest.at.getDate()} ${pad(nearest.at.getHours())}:${pad(nearest.at.getMinutes())}`;
        document.getElementById("sticky-countdown").textContent =
          `距放号 ${formatRemain(nearest.at - now)}`;
      }
      tick();
      setInterval(tick, 1000);
      setupReminders(schedules);

      document.getElementById("ics-btn").addEventListener("click", () => downloadIcs(schedules));

      renderBooking(data.booking_entries || []);
      renderDoctors(data);

      document.getElementById("channels").innerHTML = (data.channels || []).map((c) => `
        <div class="channel"><strong>${c.channel}</strong><span>${c.detail}</span></div>
      `).join("");
      document.getElementById("tips").innerHTML = (data.tips || []).map((t) => `<li>${t}</li>`).join("") || "<li>暂无</li>";
      document.getElementById("disclaimer").textContent = data.disclaimer || "";
    }

    loadData().then(render).catch((err) => {
      document.getElementById("booking-grid").innerHTML =
        `<div class="notice">页面数据加载失败：${err.message}</div>`;
    });
  </script>
</body>
</html>
