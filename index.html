  <style>
    :root {
      --bg0: #eef4f2;
      --bg1: #d9ebe4;
      --ink: #163028;
      --muted: #4d665b;
      --line: rgba(22, 48, 40, 0.14);
      --accent: #0f7a5f;
      --accent-soft: rgba(15, 122, 95, 0.12);
      --warn: #8a4b12;
      --surface: rgba(255, 255, 255, 0.72);
      --shadow: 0 18px 40px rgba(22, 48, 40, 0.08);
      --radius: 18px;
      --font-display: "ZCOOL XiaoWei", "Noto Sans SC", serif;
      --font-body: "Noto Sans SC", sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: var(--font-body);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 10% -10%, #cfe8df 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #f3efe3 0%, transparent 50%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
    }

    .wrap {
      width: min(1080px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 2rem 0 4rem;
    }

    .hero {
      padding: 1.5rem 0 1.25rem;
      animation: rise 0.7s ease both;
    }

    .brand {
      font-family: var(--font-display);
      font-size: clamp(2rem, 5vw, 3.2rem);
      line-height: 1.15;
      margin: 0 0 0.6rem;
      letter-spacing: 0.02em;
    }

    .lead {
      margin: 0;
      max-width: 38rem;
      color: var(--muted);
      font-size: 1.02rem;
      line-height: 1.7;
    }

    .meta {
      margin-top: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.35rem 0.7rem;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    .panel {
      margin-top: 1.4rem;
      padding: 1.25rem 1.3rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      animation: rise 0.8s ease both;
    }

    .panel h2 {
      margin: 0 0 0.85rem;
      font-family: var(--font-display);
      font-size: 1.55rem;
      font-weight: 400;
    }

    .channels {
      display: grid;
      gap: 0.75rem;
    }

    .channel {
      display: grid;
      gap: 0.2rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--line);
    }
    .channel:last-child { border-bottom: 0; padding-bottom: 0; }
    .channel strong { color: var(--accent); font-weight: 700; }
    .channel span { color: var(--muted); line-height: 1.6; font-size: 0.95rem; }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-top: 1rem;
    }

    .btn {
      appearance: none;
      border: 0;
      text-decoration: none;
      color: white;
      background: var(--accent);
      padding: 0.75rem 1.1rem;
      border-radius: 12px;
      font: inherit;
      font-weight: 500;
      transition: transform 0.18s ease, background 0.18s ease;
    }
    .btn:hover { transform: translateY(-1px); background: #0c6650; }
    .btn.secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.4fr 1fr auto;
      gap: 0.7rem;
      margin: 1rem 0 0.8rem;
    }
    @media (max-width: 720px) {
      .toolbar { grid-template-columns: 1fr; }
    }

    input, select {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.9);
      border-radius: 12px;
      padding: 0.8rem 0.9rem;
      font: inherit;
      color: var(--ink);
      outline: none;
    }
    input:focus, select:focus {
      border-color: rgba(15, 122, 95, 0.45);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .count {
      align-self: center;
      color: var(--muted);
      font-size: 0.92rem;
      white-space: nowrap;
    }

    .list {
      display: grid;
      gap: 0.55rem;
      margin-top: 0.4rem;
    }

    .doc {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem 1rem;
      align-items: center;
      padding: 0.9rem 0.2rem;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: inherit;
      transition: background 0.15s ease, padding-left 0.15s ease;
    }
    .doc:hover {
      background: var(--accent-soft);
      padding-left: 0.55rem;
      border-radius: 10px;
    }
    .doc .name {
      font-weight: 700;
      font-size: 1.05rem;
    }
    .doc .sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.15rem;
    }
    .fee {
      color: var(--accent);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .tips {
      margin: 0;
      padding-left: 1.1rem;
      color: var(--muted);
      line-height: 1.7;
    }

    .notice {
      margin-top: 1rem;
      padding: 0.9rem 1rem;
      border-left: 3px solid var(--warn);
      background: rgba(138, 75, 18, 0.08);
      color: var(--warn);
      border-radius: 0 12px 12px 0;
      font-size: 0.92rem;
      line-height: 1.6;
    }

    .footer {
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  <script>
    async function loadData() {
      const el = document.getElementById("appointment-data");
      if (el && el.textContent.trim()) {
        return JSON.parse(el.textContent);
      }
      const res = await fetch("./data/appointment.json", { cache: "no-store" });
      if (!res.ok) throw new Error("failed to load data");
      return res.json();
    }

    function money(fee) {
      if (fee == null || fee === "") return "";
      return `参考 ¥${fee}`;
    }

    function render(data) {
      document.getElementById("brand").textContent = data.hospital || "上海市肺科医院";
      const crawled = data.crawled_at ? new Date(data.crawled_at).toLocaleString("zh-CN") : "未知";
      document.getElementById("meta").innerHTML = [
        `<span class="chip">科室 ${data.departments.length}</span>`,
        `<span class="chip">医生 ${data.doctors.length}</span>`,
        ...(data.release_times || []).map((t) => `<span class="chip">${t}</span>`),
        `<span class="chip">更新 ${crawled}</span>`,
      ].join("");

      document.getElementById("channels").innerHTML = (data.channels || []).map((c) => `
        <div class="channel">
          <strong>${c.channel}</strong>
          <span>${c.detail}</span>
        </div>
      `).join("");

      document.getElementById("official").innerHTML = (data.official || []).map((o) => {
        const cls = o.url.startsWith("tel:") ? "btn secondary" : "btn";
        return `<a class="${cls}" href="${o.url}" target="_blank" rel="noopener noreferrer">${o.name}</a>`;
      }).join("");

      document.getElementById("disclaimer").textContent = data.disclaimer || "";

      const deptSelect = document.getElementById("dept");
      const depts = [...new Set(data.doctors.map((d) => d.department).filter(Boolean))].sort();
      depts.forEach((name) => {
        const opt = document.createElement("option");
        opt.value = name;
        opt.textContent = name;
        deptSelect.appendChild(opt);
      });

      const tips = document.getElementById("tips");
      tips.innerHTML = (data.tips || []).map((t) => `<li>${t}</li>`).join("") || "<li>暂无</li>";

      const qInput = document.getElementById("q");
      const list = document.getElementById("doctors");
      const count = document.getElementById("count");

      function paint() {
        const q = qInput.value.trim().toLowerCase();
        const dept = deptSelect.value;
        const rows = data.doctors.filter((d) => {
          const hitDept = !dept || d.department === dept;
          const blob = `${d.name || ""} ${d.department || ""} ${d.title || ""}`.toLowerCase();
          const hitQ = !q || blob.includes(q);
          return hitDept && hitQ;
        });
        count.textContent = `显示 ${rows.length} 位`;
        list.innerHTML = rows.map((d) => `
          <a class="doc" href="${d.url || '#'}" target="_blank" rel="noopener noreferrer">
            <div>
              <div class="name">${d.name}</div>
              <div class="sub">${[d.title, d.department].filter(Boolean).join(" · ")}</div>
            </div>
            <div class="fee">${money(d.fee)}</div>
          </a>
        `).join("") || `<div class="sub">没有匹配的医生</div>`;
      }

      qInput.addEventListener("input", paint);
      deptSelect.addEventListener("change", paint);
      paint();
    }

    loadData()
      .then(render)
      .catch((err) => {
        document.getElementById("channels").innerHTML =
          `<div class="notice">页面数据加载失败：${err.message}</div>`;
      });
  </script>
