<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>全球中文旅行文旅</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background: linear-gradient(165deg, #0f3554 0%, #1a4f7a 40%, #f4f8fc 40%);
        color: #1a2a35;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
        padding: 1.5rem;
      }
      header {
        color: #fff;
      }
      h1 {
        font-size: 1.75rem;
        line-height: 1.3;
        margin: 1.5rem 0 0.5rem;
        color: #fff;
      }
      .accent {
        color: #a8e6ff;
      }
      .lead {
        color: rgba(255, 255, 255, 0.9);
        line-height: 1.6;
        font-size: 0.95rem;
      }
      .btns {
        margin: 1.25rem 0 2rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .btns a {
        padding: 0.6rem 1rem;
        border-radius: 999px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
      }
      .primary {
        background: #fff;
        color: #1a4f7a;
      }
      .ghost {
        border: 1px solid rgba(255, 255, 255, 0.5);
        color: #fff;
      }
      main {
        background: #f4f8fc;
        border-radius: 16px;
        padding: 1.25rem;
      }
      main h2 {
        color: #1a4f7a;
        font-size: 1.1rem;
      }
      ul {
        line-height: 1.65;
        padding-left: 1.2rem;
      }
      footer {
        font-size: 0.75rem;
        color: #666;
        margin-top: 1rem;
        padding: 0 0 2rem;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <strong>全球中文旅行文旅</strong>
        <p class="lead" style="margin-top: 0.5rem">仅中文 · 中国护照视角</p>
      </header>
      <h1>纠结去哪？<br /><span class="accent">转盘抽 · Word 攻略一键出</span></h1>
      <p class="lead">
        本页为静态介绍页。完整功能请在本目录上级运行 <code>npm run dev</code> 后打开
        <strong>/</strong> 或 <strong>/travel</strong>。
      </p>
      <div class="btns">
        <a class="primary" href="/travel/spin">进入抽签（需本地服务）</a>
        <a class="ghost" href="/travel/hub">全部功能</a>
      </div>
      <main>
        <h2>你能做什么</h2>
        <ul>
          <li>全球盲盒抽签 · 四级地区</li>
          <li>目的地知识库 · 适配测评 ¥5.99 · Word ¥19.99</li>
          <li>旅友社区 · UGC 攻略 · 频道 · 赛事 · 助农文创 · IP</li>
        </ul>
      </main>
      <footer>旅行参考，非官方决策依据。不在 GitHub Pages 公开发布，请自建部署。</footer>
    </div>
  </body>
</html>
